name: Build and Deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14.x'

      - name: Install dependencies and build website
        run: |
          yarn install
          yarn run build

      - name: Build resume source file
        run: yarn run build:resume

      - name: Compile resume PDF from LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume/resume.tex
          latexmk_use_xelatex: true

      - name: Prepare deployment folder
        run: |
          # The resume PDF is generated in the root, move it
          mkdir -p build/files/resume
          mv resume.pdf build/files/resume/resume.pdf

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: build

